# EnhancedMobs — configuration
# All values are read once on server start / reload.

# Schema generation. Do not edit. On startup, if this differs from the plugin's bundled
# version, the file is auto-migrated to the new format while keeping your changes
# (the previous file is saved as config.yml.bak).
config-version: 3

leveling:
  # Master switch for the mob leveling system.
  # false = monsters spawn vanilla (no level, no stat scaling, no traits).
  enabled: true
  # Hard cap on mob level.
  max-mob-level: 500
  # Danger added per block of distance from the world's spawn point.
  distance-factor: 0.02
  # Final coefficient applied to the fully-computed level (after dimension/location scaling).
  # Tunes the overall ceiling; <1 lowers every mob's level uniformly.
  final-multiplier: 0.72
  # Leveled mobs' projectile (arrow/trident etc.) damage gains this fraction of their melee
  # leveling bonus on top. 0.4 = ranged scales at 40% of melee (ranged is already strong).
  ranged-damage-factor: 0.4

enhancement:
  # Master switch for the player weapon/armor enhancement system
  # (kill/hit XP leveling + anvil refine/forge/repair). false disables all of it.
  enabled: true
  # Multiplier on the XP required to level a weapon/armor piece.
  # 1.0 = default; 2.0 = twice as much XP needed (slower); 0.5 = half (faster).
  xp-multiplier: 1.0
  # Level N is spread over ~10 coarse draws of (N/10) + (N%10) fine draws of 1,
  # each landing on a random stat. Total applications = N; few draws = high variety.
  coarse-draws: 10
  per-step:
    health: 1.0           # +0.5 heart per application (attribute units)
    armor: 0.5
    attack-damage: 0.25   # melee mobs only (no effect on arrows / creepers)
    movement-speed: 0.005
  # Cap on the total speed bonus; high speed breaks mob AI/pathfinding.
  max-speed-bonus: 0.3

traits:
  # Roll traits on leveled mobs. false = mobs still get levels/stats but no traits.
  # (Independent of leveling.enabled; if leveling is off, no traits roll regardless.)
  enabled: true
  # Max number of distinct traits one mob can roll.
  max-count: 4
  # Chance to stop rolling after each trait granted (varies how many a mob gets).
  suppression: 0.1
  # How often (ticks) aura/periodic traits fire (SHULKER, KILLER_AURA, PULLING, REPELLING).
  tick-interval: 20
  # L2H trait_cost: scales effective trait cost AND the trait count (max-count / cost-factor).
  # 1.0 = default; lower = cheaper + more traits; 0 = free (all eligible traits at max rank).
  cost-factor: 1.0
  # Absolute trait rank ceiling. Traits roll up to their own max-rank, capped here.
  global-max-rank: 5

skills:
  # On/off switch per leveling skill. A disabled skill is never rolled (or rerolled into),
  # and any item that already has it shows "（無効化中）" and its effect does nothing.
  # Default: every skill on EXCEPT area_break (範囲破壊).
  durability: true        # 耐久強化  (全装備)
  flying: true            # 飛翔      (斧)
  all_in: true            # オールイン (斧)
  takenoko: true          # たけのこ魔法 (斧)
  asahi_mourning: true    # 旭の弔い   (斧)
  valor: true             # 勇猛果敢   (剣)
  dash: true              # 突飛      (剣)
  energy_absorb: true     # エネルギー吸収 (剣)
  hero_hymn: true         # 朽ちた英雄の賛歌 (剣)
  fire_charge: true       # ファイアチャージ (剣)
  megaton_smash: true     # メガトンスマッシュ (メイス)
  charge_relief: true     # 突進軽減   (槍)
  spear_throw: true       # 投擲      (槍)
  traction: true          # 牽引      (槍)
  bullseye: true          # 正鵠を射る (弓)
  fast_mining: true       # 高速採掘   (ピッケル)
  area_break: false       # 範囲破壊   (ピッケル) ← 既定でオフ
  great_luck: true        # 豪運      (ピッケル)
  max_health: true        # 最大体力増加 (防具)
  just_block: true        # ジャストブロック (防具)
  debuff_immunity: true   # デバフ免疫  (防具)
  armor_boost: true       # 防具性能上昇 (防具)
  past_gift: true         # 過去からの贈り物 (防具)
  lion_heart: true        # 獅子の心臓  (チェストプレート)
  set_bonus: true         # セット商法  (チェストプレート)
  adaptive: true          # Adaptive    (チェストプレート)
  lingering_ember: true   # 往昔の余燼   (チェストプレート)
  fleeting_dream: true    # 須臾の夢     (チェストプレート)
  thunderbolt: true       # サンダーボルト (剣)
  gun_shield_abolition: true  # ガン盾廃止令 (盾)
  effective_counter: true     # 効果的な反撃 (盾)
  abekobe: true               # あべこべ    (盾)
  hollowing: true             # 伽藍洞      (斧)
  gambler: true               # 博打打ち    (斧)
  auto_intercept: true        # オート迎撃   (メイス)
  crit_rate: true             # 会心率増加   (全)
  crit_power: true            # 会心ダメージ増加 (全)
  crit_mastery: true          # 会心システム強化 (全)
  spell_refactor: true        # スペルリファクター (剣)

# Death graves. On death (unless keepInventory or empty), items are stored in a grave that
# only physically appears (a double chest + floating "<name>の墓" label) when the owner is
# within range. While away/offline the grave does not exist, so no one can touch it.
grave:
  enabled: true
  # Worlds where graves are never created (mob/items drop vanilla-style instead).
  disabled-worlds: []
  # Real-world days before a grave expires and drops its contents in place.
  # Lowering this (e.g. ~0.007 = 10 min) makes the grave just a short "items last a bit longer" buffer.
  expiry-days: 7.0
  # Owner proximity (blocks) that materializes the grave and enables /grave recover.
  range: 32.0
  # Max radius (blocks) of the placement search for a good grave spot. Lower = more likely to
  # fall back farther (effective penalty).
  search-radius: 196
  # Enable the /grave command (list + recover).
  command-enabled: true
  # --- Death penalty knobs ---
  # Percent of dropped items that are RECOVERED into the grave. The rest scatter at the death
  # spot (an "abandonment" rate: not deleted, but left where you died — may burn in lava etc.).
  # 100 = no loss.
  recovery-rate: 100.0
  # Each damageable item stored in the grave loses a random 0..N percent of its durability.
  # 0 = off.
  durability-loss-max: 0.0
  # Each enhanced item stored in the grave loses N percent of its total invested XP (level is
  # re-derived lower). 0 = off.
  xp-loss: 0.0

logging:
  # Log each mob that spawns WITH traits, as "<type> Lv<n> [TRAITS]". Spammy; testing only.
  traited-spawns: false

default-difficulty:
  # Base danger added to every mob before the other components.
  base: 1
  # Standard deviation of the random level wobble. Set 0 for deterministic levels.
  variation: 2.0

danger:
  # Nether/End exposure: value * (online players who have visited / online total).
  nether-value: 16.0
  end-value: 25.0
  # Personal "gravity": D_personal = cbrt(sum of kills/chunkDist^1.6) * importance.
  # Importance index I = K0 / (K0 + this), K0 = nearest player's kills.
  # I=0.5 at this many kills; newbies (~0) cancel a nearby veteran's pull.
  importance-half-kills: 100.0

mob-bonus:
  # Per-mob-type level bonus, applied to the computed level BEFORE traits are rolled
  # (so a boosted boss also rolls more and stronger traits).
  #   add:      flat levels added
  #   multiply: fractional bonus (0.15 = +15%)
  # Final level = round(level * (1 + multiply)) + add
  # Keys are the entity's short type name. Non-monster bosses listed here (e.g. the ender
  # dragon, which is not a "Monster") are opted into the leveling system by their presence.
  ender_dragon:
    add: 100
    multiply: 0.0
  wither:
    add: 100
    multiply: 0.15
  warden:
    add: 150
    multiply: 0.25

display:
  glow:
    # Outline-glow mobs at or above strong-level (coarse "danger" cue).
    enabled: true
    strong-level: 100
  head:
    # Floating "Lv.X" text above the mob's head (separate from its name).
    enabled: true
    # Render distance in blocks.
    view-distance: 32
