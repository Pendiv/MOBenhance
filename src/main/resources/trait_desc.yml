# Trait descriptions (Japanese). Keyed by L2Hostility/GTsolo trait id.
# Extracted from gtcsolo ja_jp.json. Rank-dependent numeric placeholders have been
# removed and rewritten as plain prose, since this codex is not tied to a specific mob.
# Used by /traithelp. Edit freely.

# --- L2Hostility base traits ---
tank: "ランクに応じて最大体力が倍増し、防御力・防具強度も上昇する。"
speedy: "ランクに応じて移動速度が大幅に上昇する。"
protection: "常時、耐性 (ランク分のレベル) の効果を持つ。"
invisible: "常時透明化する。"
fiery: "攻撃者と攻撃対象を一定時間発火させる。自身は火炎無効。"
regenerate: "毎秒、最大体力の一定割合を回復する。"
adaptive: "受けたダメージタイプを記憶し、そのタイプへの軽減を被弾ごとに蓄積する。直近の数種類まで記憶する。"
reflect: "受けた直接物理ダメージの一定割合を魔法ダメージとして反射する。"
shulker: "一定間隔ごとに追尾弾を発射する。"
grenade: "一定間隔ごとに爆発弾を発射する。"
corrosion: "攻撃命中時、対象の装備をランダムに選び耐久消費を増加させる。対象の装備が足りない場合、不足分だけ与ダメージが増加する。"
erosion: "攻撃命中時、対象の装備をランダムに選び耐久値を直接削る。対象の装備が足りない場合、不足分だけ与ダメージが増加する。"
growth: "スライム専用。体力満タン時に巨大化する。再生特性を自動で獲得する。"
split: "死亡時、レベル半分・同特性の個体 2 体に分裂する。分裂のたびこの特性のランクは 1 下がる。"
drain: "同レベルのポーション特性をランダムに 1 つ獲得する。攻撃命中時、対象の有益効果を解除し、有害効果 1 つにつき与ダメージが増加して効果時間も延長する。"
counter_strike: "攻撃を受けると、反撃を試みる。"
dementor: "物理ダメージに耐性を持つ。与ダメージは防具を貫通する。"
dispell: "魔法ダメージに耐性を持つ。与ダメージは魔法的な保護を貫通する。対象のエンチャント装備をランダムに選び、一定時間エンチャントを無効化する。"
undying: "死亡するたび、全回復して蘇る。"
teleport: "瞬間移動で物理ダメージを回避し、対象を追跡する。"
repelling: "一定範囲内の敵対する存在を押し退け、飛び道具を無効化する。"
pulling: "一定範囲内の敵対する存在を引き寄せる。"
reprint: "対象のエンチャントを複写し、そのエンチャント量に応じて与ダメージが増加する。"
killer_aura: "自身を狙う相手に一定間隔で魔法ダメージを与える。特性効果も同時に付与する。"
ragnarok: "攻撃命中時、対象の装備をランダムに選び封印する。解除には時間がかかる。"
weakness: "攻撃命中時、対象に弱体化 (ランク分のレベル) を付与する。"
slowness: "攻撃命中時、対象に移動速度低下を付与する。"
poison: "攻撃命中時、対象に毒を付与する。"
wither: "攻撃命中時、対象にウィザーを付与する。"
levitation: "攻撃命中時、対象に浮遊を付与する。"
blindness: "攻撃命中時、対象に盲目を付与する。"
nausea: "攻撃命中時、対象に吐き気を付与する。"
soul_burner: "攻撃命中時、対象を魂の炎で焼く。"
freezing: "攻撃命中時、対象を凍結させる。"
cursed: "攻撃命中時、対象に呪いを付与する。"

# --- GTsolo custom traits ---
sorrow_elegy: "周囲の敵は死亡しても仮死状態になる。所持者が倒れると仮死は死亡として確定する。ランク2以降は確定の代わりに全快で復活。ランク3では仮死を経た者と自身が、仮死後も続く最大体力2倍を獲得する。"
turning_heavens: "世界に一体のみ存在できる。特性『不死』と『ディメンター』を獲得し、デスポーンしない。存在する限り、同次元のプレイヤーは5秒ごとに軽減も回避もできないダメージを受け、その度に所持者の座標が通知される。"
gate_triumph: "同次元にプレイヤーが居るなら一定間隔で、最寄りプレイヤーの近くへテレポートし周囲のモブを引き連れる。周囲にモブが居なければ、その次元/バイオームに適したモブを召喚して引き連れる。"
sky_scorching_flame: "与える攻撃が炎属性に変換される。焼かれたプレイヤーの炎上は自然には鎮火せず、炎上ダメージを受けるたび追加で現在体力に応じたダメージを受ける。"
mediator_field: "自身の足元を継続的に不明なブロックへ置き換え続ける。踏んだプレイヤーはブロックごとに焼き込まれたデバフを受ける。不明なブロックは破壊すると元のブロックに戻る。適正ツールは鍬。"
phantom_mantle: "纏幻パーティクルを纏い、プレイヤーに触れると移す。纏幻を持つ者への攻撃は、ダメージ軽減効果と防御力を適用できない確定ダメージになる。纏幻は消えた後しばらくのCTを経て自身に再付与される。"
famine: "周囲のプレイヤーへ空腹を付与し続ける。空腹エフェクトを持つプレイヤーは、近くにこの特性持ちが居る間、食事しても満腹度が回復しない。"
stupefaction: "プレイヤーが攻撃を行うとき、周囲にこの特性を持つモブが居るなら、攻撃は50%の確率で外れる。"
trinity_life: "一定間隔で [物理反射 / 魔法生態 / 不死] からランダムに1つを獲得し、期限切れで再抽選する。周囲に別の三体生命が居ると共鳴し、最大体力上昇効果と再生Vを獲得する。"
dream_melt: "死亡すると消滅するが、一定時間後に復活する。これを無限に繰り返し、復活のたび攻撃力・最大体力を上昇させ続ける。不死を無効化するエンチャントが有効。"
alice_syndrome: "ゾンビ専用。被ダメージを35%軽減。プレイヤーから攻撃を受けると低確率で子供かジャイアントに変身する。たまに大人にも変化する。"
desperate_charge: "プレイヤーに攻撃すると偶に上級スキルノードを1つ無効化する。同時に自身は封印状態に入り、最大体力が減少し防御力/防具強度が0になる。双方とも継続時間は同じ。"
muscle_memory: "受けたステータス上昇効果が永続として焼き付く。レベル2以上では焼き付く量が本来より増える。"
endure: "1度のみ致死ダメージをHP1で耐え、以後数秒間無敵。"
first_meeting: "プレイヤーから初めて受けるダメージを完全に無効化する。"
cutoff: "最大体力1%に満たないダメージを受け付けない。"
walking_abyss: "奈落に落下すると、一定範囲内の最も近くの地面へ瞬間移動する。"
magical_creatures: "受けた魔法ダメージをそのまま回復に転換する。"
anger: "自身のHPが減るほど与ダメージが増加する。"
domination_over_victory: "ボス専用。与ダメージの一部が防御を無視するようになる。"
wizardry: "ごく低確率で最寄りプレイヤーと位置を入れ替える。地面が無いと不発。"
explosive_resonance: "爆発ダメージを受ける代わりに、その分だけ回復する。"
rebirth: "受けたダメージの一定割合を回復する。"
fact_adaptation: "攻撃時、対象の緩衝体力と等しいダメージを与える。"
ground_battle: "一定範囲内のプレイヤーの浮遊・飛行手段を無効化する。"
paradise_lost: "攻撃者の武器の基礎攻撃力を無効化する。"
group_psychology: "周囲の味方数に応じてダメージ量が上昇する。"
innocence_battle: "超遠距離及び非プレイヤー由来のダメージを完全拒否する。"
laziness: "周囲の敵味方を問わず攻撃力を大幅に低下させる。"
summoning_ritual: "死亡時、同種のより強大な敵を 1 体召喚する。"
incomplete_combustion: "満タンからの 1 撃即死で復活する。一度でも被弾していれば発動しない。"
arrogance: "プレイヤーから攻撃されない限り継続する超回復を獲得する。"
lunatic_curse: "1 度のみ。攻撃したプレイヤーの体力を初期値まで削る。"
gambler: "一定確率で被ダメージを増加もしくは減少させる。レベルが上がるとよりレバレッジが増大する。"
equal: "プレイヤーと対峙したと確定した瞬間から数秒間無敵になる。"
rejection_unknown: "ダメージタイプごとに超軽減を発動する。同じダメージタイプを受けるほど軽減率が減少する。"
soul_destruction: "プレイヤーの復活効果を貫通し、そもそも発動させない。"
cooperativeness: "スポーン時、同特性を持つ周囲の敵とHPを合算し均等に再配分する。"
pandemic: "接触で他mobに同特性を感染させる。感染すると攻撃力が増加し自然減衰で収束する。"
bushido_spirit: "正々堂々と戦う。武士にふさわしいステータス上昇を受けるが、他ボス以外の参戦を拒否する。"
resentment: "プレイヤー由来ダメージが50%未満で死亡すると、周囲のプレイヤーに大量のデバフを配布する。"
dragonic_heart: "周囲に追尾するエンドクリスタル4基を生成。残存中は受けるダメージを90%カットし、継続回復する。クリスタルを全て破壊すれば解除される。攻撃力も常時上昇している。"
high_altitude: "体力が4倍になり、受けるダメージも3倍になる。"
last_stand: "1 度のみ。瀕死になると、最寄りプレイヤーと現在体力の割合を入れ替える。"
chain_detonation: "クリーパー専用。爆発・炎ダメージで起爆する。群れごと連鎖爆発する。"
hair_trigger: "クリーパー専用。起爆までの時間を短縮する。"
kin_call: "ゾンビ専用。攻撃を受けた際、本来より仲間を呼ぶ確率が増加する。"
proximity_fuse: "クリーパー専用。視認・遮蔽を問わず、近くに一定時間プレイヤーが居続けたら着火する。"
peer_pressure: "クリーパー専用。自身が着火した場合、プレイヤー近傍の他クリーパーも同時に起爆させる。"
second_chance: "クリーパー専用。爆発したあと1度のみ復活する。"
full_tank: "クリーパー専用。爆発威力が増大し、爆発に火炎を纏う。"
explosive_heresy: "クリーパー専用。正常な自爆以外の爆発で与えるダメージが大幅に増加する。"
lovesick: "クリーパー専用。着火した瞬間からプレイヤー方向へ歩み寄る。"
volatile_mix: "クリーパー専用。爆発後、爆心地に残留デバフ雲を放つ。"
contrarian: "クリーパー専用。炎・爆発・着火でダメージは受けるが起爆しない。水接触または通常プロセスでのみ爆発する。"
summon_kin: "クリーパー専用。一定時間ごとに別個体のクリーパーを召喚する。"
homing_shot: "スケルトン専用。放った矢に緩い追尾補正がかかる。"
rapid_fire: "スケルトン専用。より速く矢を撃ち続ける。"
burst_fire: "スケルトン専用。最初の数発のみ高速で矢を撃つ。"
centripetal_force: "クリーパー専用。爆発のプロセス中、プレイヤーを緩やかに引き寄せる。"
broken_window: "周囲の最もレベルが高く、特性を 1 つ以上所持しているMOBの特性をランダムに 1 つ参照し、それを自身と周囲にばら撒く。特性のレベルは参照元以下でランダムとなり、この特性そのものは対象に選ばれない。"
lone_wolf: "周囲にMOBが居ないとパワーアップする。"
second_sleep: "倒されたあと、ランダムな時間後に復活する。1 回限り。"
audience_effect: "周囲にプレイヤーがいない場合、MOBが強化される。この効果はある程度重複する。"
hunger_drain: "攻撃すると対象の満腹度を減少させる。"
well_fed_defense: "プレイヤーから攻撃を受けるとき、満腹度が最大から減少しているなら、その減少割合と同値だけ受けるダメージを低減する。"
well_fed_strike: "プレイヤーの体力割合が多いほど攻撃力が増加する。"
vain_glory: "特殊体力に移行する。元の体力の200%を保持し、受けるダメージ/回復はすべて特殊体力に反映される。特殊体力が 0 になると死亡する。"
distant_horizon: "プレイヤーの攻撃を受けるとき、プレイヤーの体力が最大から減少しているなら、その減少割合と同値だけ受けるダメージを低減する。"
diurnal: "昼間、ダメージ軽減と緩やかな継続回復を得る。"
showstopper: "常に燃え盛り発光する。火炎耐性を持つ。"
accumulation: "クリーパー専用。爆発ダメージを受けるたび、爆発威力と範囲が増大する。"
spacetime_dive: "潜航状態となり、物理ダメージを無効化する。魔術ダメージのみ受ける。他のmobのターゲットから除外される。"
spacetime_transcendent: "時空タイプを持たないmobを削除する。ただし低確率で殺さず、対象に時空タイプの特性を付与する。自身は他のmobのターゲットから除外される。"
spacetime_annihilation: "プレイヤーを殺害して復活されると確殺を獲得する。確殺保持中は復活手段を無視して殺害する。確殺保持者は発光し攻撃力が上昇する。"
spacetime_chain_of_causality: "プレイヤーがモブを殺害すると低確率でその地点へ瞬間移動する。近くでモブが殺されるたびに攻撃力が上昇し、その一部を周囲の時空タイプmobへ拡散する。"
spacetime_entry: "時空タイプの特性を所持しているとみなされる。この特性自体に大した効果はない。"
spacetime_gap: "周期的に全回復するサイクルを行い続ける。攻撃を受けるとそのサイクルは失敗とみなされる。サイクルはレベルが上がるほど短くなる。"
spacetime_leap: "まれにプレイヤーの近くへテレポートする。周期はレベルが上がるほど短くなる。"
spacetime_shadow: "移動速度が大きく上昇し透明化する。透明な間は攻撃力を持たない。プレイヤーをより遠くから察知するが、接近されると透明が解け攻撃力が戻る。"
spacetime_shadow_raid: "プレイヤーに与えたダメージ分だけ隠蔽を付与する。隠蔽は最大HPを同量削り、しばらく持続する。効果以外の回復で徐々に戻る。"
spacetime_conformity: "倒されると、その世界の時刻が夜になる。その夜のうちは他の迎合が倒されてもこの特性は再発動しない。"
spacetime_rejection: "時空タイプを持たないmobとプレイヤーに継続的な小ダメージを与える。ダメージは自身の攻撃力を参照し、範囲も参照割合もレベルで増す。"
spacetime_resonance: "周囲の時空タイプmobに小幅な攻撃力上昇と継続回復を与える。対象も共鳴を持つ場合は効果が増す。"
spacetime_tidal_force: "周囲の時空タイプmobにかかったデバフの継続時間を早く経過させる。早める量はレベルが上がるほど大きい。"
spacetime_bone_picker: "近隣の時空タイプmobが倒れるたびに、攻撃力が上昇し最大HPの一定割合を回復する。累積する。"
spacetime_equilibrium: "周囲の時空タイプmobとプレイヤーの攻撃力を時間とともに徐々に下げる。下がりきる最大値はレベルに依存する。"
spacetime_confusion: "周期的に、周囲のmobとプレイヤーそれぞれの攻撃力を50%〜200%でランダムに変動させる。一定間隔で振り直す。"
spacetime_rupture: "プレイヤーを攻撃する際、プレイヤーのHP割合が高いほど与ダメージが増し、防御を無視する度合いも増す。"
spacetime_conqueror: "近くに他の時空タイプmobが存在できない。その代わり全ステータスが大きく上昇する。"
spacetime_devotion: "出現時にHPが最大の半分になり、永続的な割合回復を得る。時空タイプmobとリンクし、満タン超過分の回復を味方へ回す。リンク先が半分を切ると自HPを供給する (供給量の数倍を消費)。"
spacetime_diffusion: "近くに新しく湧いたmobが、低確率で時空タイプの特性を獲得する。"
spacetime_infinite_recursion: "死亡時、この特性を近隣のランダムなモブへ移譲する。獲得時に最大HPが上昇し同量回復する。近隣にmobがいなければプレイヤーに憑き、そのプレイヤーの死亡でさらに移譲する。"
spacetime_eternal_return: "死亡時に復活する。復活すると特性を再抽選し、そのうちひとつはランダムな時空タイプの特性を獲得する。その抽選は永劫回帰を引きやすい。"
spacetime_hero: "初期は無効。有効化までに一定時間を超えると特性自体が消滅する。周囲で時空タイプmobが死ぬたびにカウントが貯まり、閾値で有効化して全快し、周囲の時空タイプmobに攻撃力上昇を付与する。"
defiance: "攻撃を受けるたびに攻撃力が増加する。"
iron_legs: "落下ダメージを無効化する。"
prepared: "出現時に、最大体力を参照した緩衝体力を獲得する。"
toss_up: "プレイヤーへの攻撃命中時、プレイヤーを上方向に打ち上げる。"
divine_might: "受けるダメージのうち、武器攻撃力・エンチャント・ポーション増加分を全て無効化する。"
all_or_nothing: "移動速度が大幅に低下する代わりに、攻撃が防御貫通かつダメージが大幅に増加する。"
damage_aura: "自身を中心とする立方体範囲内に持続的な小ダメージを与える。"
just_parry: "プレイヤー攻撃を稀に完全無効化する。確率はレベルで増加する。"
bomber_dispatch: "たまにプレイヤー目掛けて、着火済みクリーパーを投擲する。レベルが上がると投擲数が増える。"
endless_tale: "確率で復活する。復活するたび確率は永続的に低下する。"
nocturnal: "夜間、攻撃力・移動速度・ダメージ軽減を獲得し緩やかな回復を得る。"
ectotherm: "熱ダメージ・寒さダメージを無効化する。"
burning_passion: "一度炎を受けると鎮火できなくなる。燃焼中は継続回復・与ダメ強化・炎耐性を得る。"
carried_away: "プレイヤーから攻撃を受けるまで、移動速度が大幅に上昇する。"
attention_seeker: "発光する。たまにカラフルな個体がいる。"
pure_heart: "デバフを免疫する。"
consequentialist: "スケルトン専用。放った瞬間に着弾位置まで進む、回避困難な帰結の矢を放つ。"
armor_shredder: "スケルトン専用。命中時、対象の防御を貫通し、その防御値に応じた追加ダメージを与える撃滅の矢を放つ。"
explosive_arrow_user: "スケルトン専用。着弾時、ブロックを破壊しない爆発を起こす爆裂矢を放つ。"
lightning_user: "スケルトン専用。プレイヤーに着弾すると、放った時点の対象の攻撃力を参照した落雷を着弾地点へ落とす雷矢を放つ。"
kongo_yasha: "受けるダメージを大幅に軽減する。プレイヤーからの攻撃には、加えて最大HPの一定割合を軽減する。"
monotone_clone: "一定間隔で、レベルと同数の弱体化したクローンをランダムな方向へ射出する。攻撃を受けるたびに次の射出が早まる。"
crossbowman: "スケルトン専用。ノックバック耐性を部分的に貫通して対象を吹き飛ばす矢を放つ。吹き飛ばされた対象は一定時間この吹き飛ばしに耐性を得る。"
floating_arrow: "スケルトン専用。対象が自身より高所にいると自ら浮遊し、命中した対象を浮遊させる矢を放つ。"
magic_bullet_marksman: "スケルトン専用。攻撃力・最大HP・ダメージ軽減を獲得する。プレイヤーが接近すると透明化し加速する。一定確率で特殊な矢をランダムに放ち、外すほど・被弾するほど確率が上がり、放つと確率は元に戻る。"
otherworld_walker: "現世でスポーンすると消滅。非現世では攻撃力・防御力・探知範囲が大きく上昇し、ネザー/エンドでさらに強化される。"
jailbreak: "出現時に自身を失効させ、コスト・重みが近い特性をランダムに2つ取得する。"
phantasma: "プレイヤーから複数回攻撃を受けるか一定時間ごとに幻惑を獲得する。幻惑は次のプレイヤー被ダメを 1 度無効化する。"
trujillo_hardin: "移動速度が初期値を超えた分を引き下げ、その超過分を攻撃力の上昇へ変換する。"
harmonious_march: "最大体力が大幅に増加する。自身の攻撃力は減少する代わりに、周囲の味方モブへ攻撃力を分け与える。"
mystic_shadow: "プレイヤーに与ダメするたび攻撃力/移動速度/防御力を少しずつ奪い自身が行使する。倒されるか一定時間無交戦で奪った分は返還される。"
distant_death: "プレイヤーから被弾するたび被ダメの一部を回復し、数回ごとに必中の反撃を行う。"
devotion: "体力が半分以下になると即死し、死亡時に周囲の味方モブを大きく回復する。"
death_aura: "周囲に炎を発し続け、範囲内のすべてに一定間隔で自身の攻撃力を参照した炎ダメージを与える。レベルによってダメージが上昇する。"
