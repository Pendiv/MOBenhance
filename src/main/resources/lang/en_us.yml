# EnhancedMobs English display text (MiniMessage format).
# Keys are referenced via Component.translatable(key); rendered per the player's client locale.
# Decorate with <red>...</red> etc.; reference arguments with <argument:0> <argument:1> ...
# Restart the server to apply edits. Missing keys fall back to Japanese, then to the raw key.

# Item enhancement lore (enhance Lv / refine / forged / about-to-break)
emob:
  item:
    lore:
      level: "<aqua>Enhance Lv.<argument:0><argument:1>"
      refine: "<gold>Refine +<argument:0>/<argument:1>"
      forged: "<light_purple>Forged"
      broken: "<red>About to break (stats 0, repair needed)"
  break:
    no_space: "<red>Your gear is about to break! Its stats are disabled (needs repair)."
    stowed: "<yellow>Your gear is about to break, so it was returned to your inventory (please repair it)."
    cleared: "<green>Durability recovered, so the about-to-break state was cleared."
  # Anvil operations
  anvil:
    repaired_broken: "<green>Durability restored (the about-to-break state clears at 75% or more)."
    repaired: "<green>Durability restored."
    repair_full: "<gray>Durability is already full."
    bonus_granted: "<light_purple>Granted the bonus skill [<argument:0>]."
    bonus_already: "<red>It already has that bonus."
    bonus_not_applicable: "<red>This item cannot receive that bonus."
    skill_rerolled: "<gold>Rerolled the skill: <argument:0>"
    reroll_none: "<red>No skill to reroll (needs Lv10+ gear with a rolled skill)."
    dragon_maxed: "<light_purple>Maxed the tool's level and refinement."
    dragon_tool_only: "<red>A Dragon Head can only be used on tools (pickaxe/shovel/axe)."
    repair_only: "<red>This item only supports durability repair (hold a repair material and right-click)."
    forged: "<light_purple>Forged."
    forge_already_mace: "<yellow>Already forged (sneak right-click to refine instead)."
    forge_already: "<red>Already forged."
    refined: "<gold>Refined."
    refine_max: "<red>Cannot refine any further."
  # Command shared
  common:
    no_perm: "<red>No permission."
    player_only: "<red>Players only."
  # /emob root
  cmd:
    unknown_sub: "<red>Unknown subcommand: <argument:0>"
    help_header: "<gold>EnhancedMobs commands"
  # /emob dimension
  dimension:
    usage: "<yellow>Usage: /<argument:0> [load|tp|gate]"
    aim_block: "<yellow>Aim at a block within 6 blocks."
    gate_placed: "<green>Gate placed (<argument:0>,<argument:1>,<argument:2>). Enter to reach Ameijia."
    already_loaded: "<gray>Already loaded."
    loading: "<gray>Loading ameijia…"
    load_ok: "<green>Loaded: <argument:0> (env <argument:1>)"
    load_null: "<red>Load failed (null). A restart may be needed."
    load_err: "<red>Load failed: <argument:0>"
    not_loaded: "<red>Not loaded (run /emob dimension load first)."
    tp_ok: "<green>Teleported to ameijia."
  # /emob skill (OP)
  skillcmd:
    usage: "<red>Usage: /<argument:0> [selector] [lvl|skill|skill_lvl] [value]"
    bad_selector: "<red>Invalid selector: <argument:0>"
    not_enhanceable: "<gray><argument:0>: held item is not enhanceable"
    unknown_mode: "<red>Unknown mode: <argument:0> (lvl/skill/skill_lvl)"
    bad_number: "<red>Invalid number: <argument:0>"
    applied: "<green>Applied to <argument:0>"
    applied_zero: "<gray>Applied to <argument:0>"
  # /emob trait (trait names/descriptions live in trait_names.yml / trait_desc.yml)
  trait:
    bad_number: "<red>Invalid <argument:0> value: <argument:1>"
    multi_match: "<yellow>Multiple traits match \"<argument:0>\":"
    not_found: "<red>Trait not found: <argument:0><newline><gray>See /traithelp for the list"
    min_level: "<yellow>Min Lv: <argument:0>"
    list_header: "<gold>Traits (<argument:0>)"
    list_header_range: "<gold>Traits, Min Lv <argument:0>-<argument:1> (<argument:2>)"
    list_empty: "<gray>No matching traits."
  # Leveling skills (item lore. name = name, descriptions = dN, numbers via arguments)
  skill:
    lore:
      disabled: "<dark_gray>Skill: <argument:0> (disabled)"
      locked: "<dark_gray>Skill: <argument:0> (unlocks at Lv<argument:1>)"
      active: "<green>Skill: <argument:0><argument:1>"
      bonus: "<light_purple>Bonus: <argument:0>"
    durability:
      name: "Durability"
      d1: "Max durability x<argument:0>"
      d2: "If it has Unbreaking, +<argument:0>"
    flying:
      name: "Flight"
      d1: "Right-click to throw the axe (returns on hit/landing)"
      d2: "Range <argument:0> blocks / CD <argument:1>s"
    max_health:
      name: "Max Health"
      d1: "While equipped, max health +<argument:0>"
    charge_relief:
      name: "Charge Relief"
      d1: "Charging restores +<argument:0> hunger and"
      d2: "negates fall damage for 5s"
    valor:
      name: "Valor"
      d1: "Each hit gains/stacks an attack-up effect"
      d2: "Max level <argument:0> / duration <argument:1>s"
    dash:
      name: "Dash"
      d1: "Right-click to dash forward (CD <argument:0>s)"
      d2: "Slashes enemies in the path for attack-based damage"
    all_in:
      name: "All-In"
      d1: "Attack speed locked to <argument:0>, in exchange for"
      d2: "attack damage +<argument:0>"
    just_block:
      name: "Just Block"
      d1: "<argument:0>% chance to fully block a hit"
    takenoko:
      name: "Bamboo Magic"
      d1: "Launches the hit enemy <argument:0> blocks up and"
      d2: "grows bamboo beneath it"
    energy_absorb:
      name: "Energy Absorb"
      d1: "While standing still, right-click to"
      d2: "heal <argument:0> hearts (CD <argument:1>s)"
    debuff_immunity:
      name: "Debuff Immunity"
      d1: "Auto-blocks one debuff (CD <argument:0>s)"
    armor_boost:
      name: "Armor Boost"
      d1: "Gain +<argument:0>% of base armor stats"
    lion_heart:
      name: "Lion Heart"
      d1: "Survive a lethal blow below 10% HP at half a heart,"
      d2: "gain totem effect and Resistance V 5s (CD <argument:0>s)"
    set_bonus:
      name: "Set Bonus"
      d1: "If all 4 armor pieces share a material:"
      d2: "Regen I, max health +<argument:0>, attack +<argument:1>"
    past_gift:
      name: "Gift from the Past"
      d1: "On death, send <argument:0>% of armor to the future"
      d2: "Receive it as an armor boost next respawn"
      d3: "(dying while holding it loses the gift)"
    hero_hymn:
      name: "Hymn of the Fallen Hero"
      d1: "On hit, seal the target's healing for <argument:0>s"
      d2: "and deal +<argument:0>% attack damage with lightning"
      d3: "[blocks trait revival effects]"
    asahi_mourning:
      name: "Rising-Sun Requiem"
      d1: "Attacks become fire-typed (<argument:0>s ignite)"
      d2: "Burning targets take +<argument:0>% fire damage,"
      d3: "cannot be healed, and revival is blocked"
    spear_throw:
      name: "Throw"
      d1: "Right-click to throw a virtual spear forward"
      d2: "Faster = stronger (speed <argument:0> / CD <argument:1>s)"
    fast_mining:
      name: "Fast Mining"
      d1: "Mining speed (efficiency) +<argument:0>"
    area_break:
      name: "Area Break"
      d1: "Right-click to break <argument:0>x<argument:1>x<argument:2> ahead"
      d2: "Swing a giant pickaxe (CD <argument:0>s)"
    great_luck:
      name: "Great Luck"
      d1: "Grants Fortune Lv<argument:0>"
    megaton_smash:
      name: "Megaton Smash"
      d1: "A mace smash hit stuns the target for <argument:0>s"
      d2: "Stunned = unable to act (bosses 25%) / CD <argument:0>s"
    fire_charge:
      name: "Fire Charge"
      d1: "Right-click to launch a fire charge forward"
      d2: "On impact: <argument:0>% attack as physical damage / CD <argument:1>s"
    gun_shield_abolition:
      name: "Anti-Turtling"
      d1: "A successful guard heals <argument:0> hearts"
      d2: "Holding block 4s+ forces a <argument:0>s cooldown"
    effective_counter:
      name: "Effective Counter"
      d1: "A successful guard knocks back the attacker and counters"
      d2: "Mainhand weapon deals <argument:0>% attack as physical / CD <argument:1>s"
    abekobe:
      name: "Swap"
      d1: "Hold a shield in mainhand, right-click to seal the offhand sword/axe"
      d2: "Its attack and attributes dwell in the shield (<argument:0>s / CD <argument:1>s)"
      d3: "Right-click the sealed item in mainhand to end early"
    traction:
      name: "Traction"
      d1: "Right-click to hurl the spear; get yanked to where it sticks"
      d2: "Range <argument:0>m / CD 1.1s (sneak to cancel, keep momentum)"
    # Shared messages for new active skills
    broken_use: "<red>Can't use it while about to break"
    abekobe_active: "<yellow>Swap is already active"
    abekobe_need_weapon: "<yellow>You need a sword or axe in your offhand"
    abekobe_sealed: "<light_purple>Weapon sealed"
    abekobe_released: "<aqua>Seal released"
    abekobe_seal_name: "<light_purple>Sealed Weapon"
  # Bonus skills
  bonus:
    night_vision:
      name: "Night Vision"
      d1: "Grants night vision while equipped"
    auto_mace:
      name: "Auto Mace"
      d1: "Shift+right-click to auto-attack the aimed enemy"
      d2: "Rise <argument:0> blocks / CD <argument:1>s"
    attack_linger:
      name: "Lingering Strike"
      d1: "<argument:0>% chance on hit to store the damage and"
      d2: "trigger a lingering effect (once per second x3)"
    bulk_break:
      name: "Vein Mine"
      d1: "Mines connected same-type blocks like ore at once"
      d2: "Range <argument:0> / up to <argument:1>"
    netherite_coating:
      name: "Netherite Coating"
      d1: "Brings the shield up to netherite leggings stats"
      d2: "Raises armor, toughness, KB resistance, durability"
