# EnhancedMobs English display text (MiniMessage format).
# Keys are referenced via Component.translatable(key); rendered per the player's client locale.
# Decorate with <red>...</red> etc.; reference arguments with <argument:0> <argument:1> ...
# Restart the server to apply edits. Missing keys fall back to Japanese, then to the raw key.

# Item enhancement lore (enhance Lv / refine / forged / about-to-break)
emob:
  item:
    lore:
      level: "<aqua>Enhance Lv.<argument:0><argument:1>"
      refine: "<gold>Refine +<argument:0>/<argument:1>"
      forged: "<light_purple>Forged"
      cast: "<aqua>Cast <argument:0>/<argument:1>"
      deified: "<gradient:#ffd700:#fff7c0>✦ Deified (cap unlocked)</gradient>"
      broken: "<red>About to break (stats 0, repair needed)"
  break:
    no_space: "<red>Your gear is about to break! Its stats are disabled."
    stowed: "<yellow>Gear about to break — returned to your inventory."
    cleared: "<green>Durability recovered, so the about-to-break state was cleared."
  # Anvil operations
  anvil:
    repaired_broken: "<green>Durability restored."
    repaired: "<green>Durability restored."
    repair_full: "<gray>Durability is already full."
    bonus_granted: "<light_purple>Granted the bonus skill [<argument:0>]."
    bonus_already: "<red>It already has that bonus."
    bonus_not_applicable: "<red>This item cannot receive that bonus."
    skill_rerolled: "<gold>Rerolled the skill: <argument:0>"
    reroll_none: "<red>No skill to reroll."
    dragon_maxed: "<light_purple>Maxed level, refine, forge &amp; casting."
    dragon_fail: "<red>This item is not a leveling item."
    repair_only: "<red>This item only supports durability repair."
    forged: "<light_purple>Forged."
    forge_already_mace: "<yellow>Already forged (sneak right-click to refine instead)."
    forge_already: "<red>Already forged."
    refined: "<gold>Refined."
    refine_max: "<red>Cannot refine any further."
  # Deification (max-tier beacon)
  deify:
    deified: "<gradient:#ffd700:#fff7c0>✦ Deified</gradient>"
    already: "<yellow>Already deified."
    need_max_beacon: "<red>A 4-layer beacon is required."
  # Casting (fully-charged respawn anchor)
  cast:
    need_full: "<red>A fully-charged respawn anchor is required."
    no_charge: "<red>Out of charge."
    charge_full: "<yellow>Already fully charged."
    progress: "<aqua>Cast <argument:0>/<argument:1>."
    ready_shard: "<gold>8 casts reached. Use an Echo Shard to raise the cap to 16."
    complete: "<green>Casting complete."
    extended: "<dark_aqua>Echo Shard raised the casting cap to 16."
    extend_need_casts: "<red>Cast <argument:0> times first."
    extend_already: "<yellow>Cap already unlocked."
  # Command shared
  common:
    no_perm: "<red>No permission."
    player_only: "<red>Players only."
  # /emob root
  cmd:
    unknown_sub: "<red>Unknown subcommand: <argument:0>"
    help_header: "<gold>EnhancedMobs commands"
  # /emob dimension
  dimension:
    usage: "<yellow>Usage: /<argument:0> [load|tp|gate]"
    aim_block: "<yellow>Aim at a block within 6 blocks."
    gate_placed: "<green>Gate placed (<argument:0>,<argument:1>,<argument:2>). Enter to reach Ameijia."
    already_loaded: "<gray>Already loaded."
    loading: "<gray>Loading ameijia…"
    load_ok: "<green>Loaded: <argument:0> (env <argument:1>)"
    load_null: "<red>Load failed (null). A restart may be needed."
    load_err: "<red>Load failed: <argument:0>"
    not_loaded: "<red>Not loaded (run /emob dimension load first)."
    tp_ok: "<green>Teleported to ameijia."
  # /emob skill (OP)
  skillcmd:
    usage: "<red>Usage: /<argument:0> [selector] [lvl|skill|skill_lvl] [value]"
    bad_selector: "<red>Invalid selector: <argument:0>"
    not_enhanceable: "<gray><argument:0>: held item is not enhanceable"
    unknown_mode: "<red>Unknown mode: <argument:0> (lvl/skill/skill_lvl)"
    bad_number: "<red>Invalid number: <argument:0>"
    applied: "<green>Applied to <argument:0>"
    applied_zero: "<gray>Applied to <argument:0>"
  # /emob trait (trait names/descriptions live in trait_names.yml / trait_desc.yml)
  trait:
    bad_number: "<red>Invalid <argument:0> value: <argument:1>"
    multi_match: "<yellow>Multiple traits match \"<argument:0>\":"
    not_found: "<red>Trait not found: <argument:0><newline><gray>See /traithelp for the list"
    min_level: "<yellow>Min Lv: <argument:0>"
    list_header: "<gold>Traits (<argument:0>)"
    list_header_range: "<gold>Traits, Min Lv <argument:0>-<argument:1> (<argument:2>)"
    list_empty: "<gray>No matching traits."
  # Leveling skills (item lore. name = name, descriptions = dN, numbers via arguments)
  skill:
    lore:
      disabled: "<dark_gray>Skill: <argument:0> (disabled)"
      locked: "<dark_gray>Skill: <argument:0> (unlocks at Lv<argument:1>)"
      active: "<green>Skill: <argument:0><argument:1>"
      bonus: "<light_purple>Bonus: <argument:0>"
    durability:
