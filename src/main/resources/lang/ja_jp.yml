# EnhancedMobs 日本語表示テキスト（MiniMessage 形式）。
# キーは Component.translatable(key) で参照され、クライアント言語に応じて出し分けられる。
# 装飾は <red>...</red> 等、引数は <argument:0> <argument:1> ... で参照する。
# 編集後はサーバ再起動で反映。未登録キーは英語 → キー文字列の順にフォールバックする。

# アイテム強化の lore（強化Lv・精錬・鍛造・破壊寸前）
emob:
  item:
    lore:
      level: "<aqua>強化 Lv.<argument:0><argument:1>"
      refine: "<gold>精錬 +<argument:0>/<argument:1>"
      forged: "<light_purple>鍛造済"
      broken: "<red>破壊寸前（性能0・要修理）"
  break:
    no_space: "<red>装備が破壊寸前です！性能を失っています（要修理）"
    stowed: "<yellow>装備が破壊寸前のためインベントリに戻しました（修理してください）"
    cleared: "<green>耐久が回復したため破壊寸前を解除しました"
  # 金床操作
  anvil:
    repaired_broken: "<green>耐久値を回復しました（75%以上で破壊寸前が解除されます）"
    repaired: "<green>耐久値を回復しました"
    repair_full: "<gray>耐久値は満タンです"
    bonus_granted: "<light_purple>付加スキル【<argument:0>】を付与しました"
    bonus_already: "<red>既に付与済みです"
    bonus_not_applicable: "<red>このアイテムには付与できません"
    skill_rerolled: "<gold>スキルを再抽選しました：<argument:0>"
    reroll_none: "<red>再抽選できるスキルがありません（Lv10以上で抽選済みの装備が必要）"
    dragon_maxed: "<light_purple>ツールをレベル・精錬MAXにしました"
    dragon_tool_only: "<red>ドラゴンの頭はツール（ツルハシ/シャベル/斧）にのみ使えます"
    repair_only: "<red>このアイテムは耐久回復のみ対応です（修理素材を持って右クリック）"
    forged: "<light_purple>鍛造しました"
    forge_already_mace: "<yellow>既に鍛造済みです（精錬する場合はスニーク右クリック）"
    forge_already: "<red>既に鍛造済みです"
    refined: "<gold>精錬しました"
    refine_max: "<red>これ以上精錬できません"
  # コマンド共通
  common:
    no_perm: "<red>権限がありません"
    player_only: "<red>プレイヤー専用です"
  # /emob 統括
  cmd:
    unknown_sub: "<red>不明なサブコマンド: <argument:0>"
    help_header: "<gold>EnhancedMobs コマンド一覧"
  # /emob dimension
  dimension:
    usage: "<yellow>使い方: /<argument:0> [load|tp|gate]"
    aim_block: "<yellow>6マス以内のブロックに照準を"
    gate_placed: "<green>ゲート召喚（<argument:0>,<argument:1>,<argument:2>）。入るとアメイジアへ"
    already_loaded: "<gray>ロード済みです"
    loading: "<gray>ameijia をロード中…"
    load_ok: "<green>ロード成功: <argument:0>（環境 <argument:1>）"
    load_null: "<red>ロード失敗（null）。要サーバー再起動かも"
    load_err: "<red>ロード失敗: <argument:0>"
    not_loaded: "<red>未ロード（先に /emob dimension load）"
    tp_ok: "<green>ameijia へ移動しました"
  # /emob skill（OP）
  skillcmd:
    usage: "<red>使い方: /<argument:0> [セレクタ] [lvl|skill|skill_lvl] [値]"
    bad_selector: "<red>セレクタが不正: <argument:0>"
    not_enhanceable: "<gray><argument:0>: 手持ちが強化対象外"
    unknown_mode: "<red>不明なモード: <argument:0>（lvl/skill/skill_lvl）"
    bad_number: "<red>数値が不正: <argument:0>"
    applied: "<green><argument:0> 人に適用"
    applied_zero: "<gray><argument:0> 人に適用"
  # /emob trait（特性ヘルプ。特性名・説明は trait_names.yml / trait_desc.yml 側）
  trait:
    bad_number: "<red><argument:0> の値が不正: <argument:1>"
    multi_match: "<yellow>「<argument:0>」に一致する特性が複数あります:"
    not_found: "<red>特性が見つかりません: <argument:0><newline><gray>一覧は /traithelp で"
    min_level: "<yellow>出現Lv: <argument:0>"
    list_header: "<gold>特性一覧 (<argument:0>件)"
    list_header_range: "<gold>特性一覧 出現Lv <argument:0>〜<argument:1> (<argument:2>件)"
    list_empty: "<gray>該当する特性はありません"
  # レベリングスキル（アイテム lore。名前 = name、説明 = dN、数値は引数で渡る）
  skill:
    lore:
      disabled: "<dark_gray>スキル: <argument:0>（無効化中）"
      locked: "<dark_gray>スキル: <argument:0>（Lv<argument:1>で有効化）"
      active: "<green>スキル: <argument:0><argument:1>"
      bonus: "<light_purple>付加: <argument:0>"
    durability:
      name: "耐久強化"
      d1: "耐久値の上限が ×<argument:0> になる"
      d2: "耐久エンチャントが付いていれば +<argument:0>"
    flying:
      name: "飛翔"
      d1: "右クリックで斧を投げる（敵に当たるか着弾で戻る）"
      d2: "射程 <argument:0>ブロック / CT <argument:1>秒"
    max_health:
      name: "最大体力増加"
      d1: "装備中、最大体力 +<argument:0>"
    charge_relief:
      name: "突進軽減"
      d1: "突進で満腹度 +<argument:0> 回復し、"
      d2: "5秒間落下ダメージを受けない"
    valor:
      name: "勇猛果敢"
      d1: "攻撃のたび攻撃力上昇を獲得・強化していく"
      d2: "上限レベル <argument:0> / 効果時間 <argument:1>秒"
    dash:
      name: "突飛"
      d1: "右クリックで前方へ突進する（CT <argument:0>秒）"
      d2: "突進中に敵を切りつけ、攻撃力依存のダメージを与える"
    all_in:
      name: "オールイン"
      d1: "攻撃速度が <argument:0> に固定される代わりに"
      d2: "攻撃力 +<argument:0>"
    just_block:
      name: "ジャストブロック"
      d1: "被弾時 <argument:0>% で攻撃を完全ブロック"
    takenoko:
      name: "たけのこ魔法"
      d1: "攻撃した敵を <argument:0>ブロック打ち上げ、"
      d2: "足元にたけのこを生やす"
    energy_absorb:
      name: "エネルギー吸収"
      d1: "立ち止まって右クリックで"
      d2: "HPを <argument:0>ハート回復（CT <argument:1>秒）"
    debuff_immunity:
      name: "デバフ免疫"
      d1: "デバフ付与を1つ自動で防ぐ（CT <argument:0>秒）"
    armor_boost:
      name: "防具性能上昇"
      d1: "素の防具性能の <argument:0>% を追加獲得"
    lion_heart:
      name: "獅子の心臓"
      d1: "HP10%以下になる攻撃を半ハートで耐え、"
      d2: "トーテム効果と耐性V5秒を得る（CT <argument:0>秒）"
    set_bonus:
      name: "セット商法"
      d1: "防具4部位の素材が共通なら"
      d2: "再生I・最大体力 +<argument:0>・攻撃力 +<argument:1>"
    past_gift:
      name: "過去からの贈り物"
      d1: "死亡時、防御力の<argument:0>%を未来へ送る"
      d2: "次のリスポーンで防御力上昇として受け取る"
      d3: "（受領中に死亡すると失い、送らない）"
    hero_hymn:
      name: "朽ちた英雄の賛歌"
      d1: "攻撃時、対象の回復を<argument:0>秒封じ"
      d2: "雷とともに攻撃力の<argument:0>%を追加で与える"
      d3: "[特性の復活効果を阻害する]"
    asahi_mourning:
      name: "旭の弔い"
      d1: "攻撃が火属性になる（<argument:0>秒着火）"
      d2: "燃焼中の対象は炎ダメージ +<argument:0>%、"
      d3: "回復を受けられず、復活効果も阻害"
    spear_throw:
      name: "投擲"
      d1: "右クリックで仮想の槍を前方へ投げる"
      d2: "速いほど高威力（初速 <argument:0> / CT <argument:1>秒）"
    fast_mining:
      name: "高速採掘"
      d1: "採掘速度（採掘効率）+<argument:0>"
    area_break:
      name: "範囲破壊"
      d1: "右クリックで視線先を <argument:0>x<argument:1>x<argument:2> 一括破壊"
      d2: "巨大ピッケルを振り下ろす（CT <argument:0>秒）"
    great_luck:
      name: "豪運"
      d1: "幸運エンチャント Lv<argument:0> を付与"
    megaton_smash:
      name: "メガトンスマッシュ"
      d1: "メイスの叩きつけ命中で対象を<argument:0>秒スタン"
      d2: "スタン中は行動不能（ボスは25%）/ CT <argument:0>秒"
    fire_charge:
      name: "ファイアチャージ"
      d1: "右クリックでファイアチャージを前方へ放つ"
      d2: "着弾で攻撃力<argument:0>%の物理ダメージ / CT <argument:1>秒"
    gun_shield_abolition:
      name: "ガン盾廃止令"
      d1: "ガード成功でHPを<argument:0>ハート回復"
      d2: "4秒以上構え続けると強制CT <argument:0>秒"
    effective_counter:
      name: "効果的な反撃"
      d1: "ガード成功で攻撃者をノックバックし反撃"
      d2: "メインハンド武器で攻撃力<argument:0>%の物理 / CT <argument:1>秒"
    abekobe:
      name: "あべこべ"
      d1: "メインハンドに盾、右クリックでオフハンドの剣/斧を封印"
      d2: "その武器の攻撃力等を盾に宿す（<argument:0>秒 / CT <argument:1>秒）"
      d3: "封印アイテムをメインハンドで右クリックすると即終了"
    traction:
      name: "牽引"
      d1: "右クリックで槍を放ち、刺さった壁へ一気に牽引する"
      d2: "射程<argument:0>m / CT 1.1秒（shiftで中断・勢いは維持）"
    # 新規アクティブスキル共通メッセージ
    broken_use: "<red>破壊寸前のため使用できません"
    abekobe_active: "<yellow>すでにあべこべが発動中です"
    abekobe_need_weapon: "<yellow>オフハンドに剣か斧が必要です"
    abekobe_sealed: "<light_purple>武器を封印しました"
    abekobe_released: "<aqua>封印を解除しました"
    abekobe_seal_name: "<light_purple>封印された武器"
  # 付加スキル
  bonus:
    night_vision:
      name: "暗視"
      d1: "装備中、暗視効果を得る"
    auto_mace:
      name: "オートメイス"
      d1: "Shift+右クリックで狙った敵をメイスが自動攻撃"
      d2: "上昇 <argument:0>ブロック / CT <argument:1>秒"
    attack_linger:
      name: "攻撃滞留"
      d1: "攻撃時 <argument:0>% でダメージを記憶し"
      d2: "滞留エフェクトが発生（1秒ごと×3回）"
    bulk_break:
      name: "一括破壊"
      d1: "鉱石など同系統ブロックをまとめて採掘"
      d2: "範囲 <argument:0> / 最大 <argument:1>個"
    netherite_coating:
      name: "ネザライトコーティング"
      d1: "盾の性能をネザライトレギンス相当へ"
      d2: "防御・防具強度・KB耐性・耐久が上昇"
