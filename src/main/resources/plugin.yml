name: EnhancedMobs
version: '$version'

main: DIV.enhancedMobs.EnhancedMobs
api-version: '26.1.2'
load: POSTWORLD
# カスタム属性・ダメージパイプライン基盤(回復倍率・与被ダメ倍率・魔法ダメージが依存)
depend: [attributelib]

commands:
  difficultyset:
    description: View or manage EnhancedMobs difficulty.
    usage: /difficultyset <get|set|add|reset> [target] [count]
  emdebug:
    description: Toggle the EnhancedMobs debug readout (shown on hit).
    usage: /emdebug
  cg:
    description: Change game mode (self toggle, or target + mode).
    usage: /cg [target] [gamemode]
  traithelp:
    description: Look up trait descriptions and appearance levels.
    usage: /traithelp [sort [min N] [max N] | <id|"name">]
  levelingskill:
    description: Manipulate the held item's enhancement level / skill (OP debug).
    usage: /levelingskill <targets> <lvl|skill|skill_lvl> <value>
    permission: enhancedmobs.levelingskill

permissions:
  enhancedmobs.difficulty.get:
    description: View your own difficulty.
    default: true
  enhancedmobs.difficulty.manage:
    description: Set, add to, or reset the difficulty offset of players.
    default: op
  enhancedmobs.debug:
    description: Toggle the debug readout.
    default: op
  enhancedmobs.cg:
    description: Change game modes.
    default: op
  enhancedmobs.traithelp:
    description: Look up trait descriptions.
    default: true
  enhancedmobs.levelingskill:
    description: Manipulate held item enhancement level / skill.
    default: op
